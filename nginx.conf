# Served by nginx inside the container; Traefik in front terminates HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # redirects say "/fuji", not "http://host/fuji": behind Traefik nginx sees plain http
    absolute_redirect off;

    # text, and the binary animation data (float32/uint16 grids, particle scenes), which compress well
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Vite's hashed bundles never change under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # wallpapers, particle scenes, animation data, video: kept a day by browsers. Cloudflare holds them
    # a month at the edge (cache rule), so purge Cloudflare's cache after a deploy that republishes them
    location ~ ^/(wallpapers|particles|data|video)/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # everything else (the pages, the sitemap) is revalidated, so a deploy shows at once.
    # A chapter is its own copy of index.html (fuji.html, written at build); any other address is a
    # real 404 whose body is index.html, so the app shows its "not found" page
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HTTPS only for a year (browsers ignore it over plain http). The rest of the CSP is a
        # <meta> written at build (vite.config.js); framing can only be refused by a header
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        rewrite ^(/.+)/$ $1 permanent;                     # /fuji/ -> /fuji, the one address of a chapter
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /index.html;
    }
}
