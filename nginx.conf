# Served by nginx inside the container; Traefik in front terminates HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # text, and the binary animation data (float32/uint16 grids, particle scenes), which compress well
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Vite's hashed bundles never change under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # wallpapers, particle scenes, animation data, video: kept a day by browsers. Cloudflare holds them
    # a month at the edge (cache rule), so purge Cloudflare's cache after a deploy that republishes them
    location ~ ^/(wallpapers|particles|data|video)/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # everything else (index.html, the sitemap) is revalidated, so a deploy shows at once
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
